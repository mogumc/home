name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # 决定资源前缀 base：
      #   1. 仓库 Variables 里设置了 VITE_BASE → 用它
      #   2. public/CNAME 存在，或 Pages 配了自定义域名 → '/'（域名根目录）
      #   3. 否则是项目页 → '/<repo>/'
      - name: Resolve base path
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "${{ vars.VITE_BASE }}" ]; then
            BASE="${{ vars.VITE_BASE }}"
            echo "使用仓库变量 VITE_BASE=$BASE"
          elif [ -f public/CNAME ] || [ -f CNAME ]; then
            BASE="/"
            echo "检测到 CNAME，按自定义域名根路径构建"
          else
            CNAME="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""' 2>/dev/null || true)"
            if [ -n "$CNAME" ]; then
              BASE="/"
              echo "Pages 已绑定自定义域名 ${CNAME}，按根路径构建"
            else
              BASE="/${REPO_NAME}/"
              echo "未检测到自定义域名，按项目页 /${REPO_NAME}/ 构建"
            fi
          fi
          echo "VITE_BASE=$BASE" >> "$GITHUB_ENV"

      - run: npm run build

      # 兜底自检：产物里的资源路径必须和 base 一致，别再静默发一个全 404 的站点
      - name: Verify asset base
        run: |
          if ! grep -q "src=\"${VITE_BASE}assets/" dist/index.html; then
            echo "::error::dist/index.html 的资源路径与 VITE_BASE=${VITE_BASE} 不一致"
            grep -o 'src="[^"]*"' dist/index.html | head -5
            exit 1
          fi
          echo "资源路径校验通过：${VITE_BASE}assets/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
